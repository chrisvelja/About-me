<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Chris Velja — Music.">
<title>Chris Velja — Music</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="music" class="music-page">
<header class="topbar music-topbar">
  <a class="wordmark" href="index.html">CV</a>
  <div class="music-top-actions">
    <div class="music-service-switch" role="group" aria-label="Music service">
      <button type="button" class="music-service-option active" data-service-select="spotify">Spotify</button>
      <button type="button" class="music-service-option" data-service-select="apple">Apple Music</button>
    </div>
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark/light mode">
      <span data-theme-icon>☼</span>
    </button>
  </div>
</header>

<main class="music-main">
  <section class="music-heading">
    <div>
      <h1>Music</h1>
      <div class="music-heading-rule"></div>
      <p>Today</p>
    </div>
  </section>

  <section class="music-pile-section">
    <div class="music-pile" aria-label="Recent albums">
      <button class="carousel-control carousel-control-left" data-music-prev aria-label="Previous album">←</button>
      <div class="vinyl-track" data-music-carousel></div>
      <button class="carousel-control carousel-control-right" data-music-next aria-label="Next album">→</button>
    </div>
  </section>

  <section class="music-selected">
    <div>
      <span class="mini">SELECTED</span>
      <h2 data-current-title>Album title</h2>
      <p data-current-artist>Artist name</p>
    </div>
    <button class="music-open-selected" data-listen-open>open ↗</button>
  </section>

  <section class="music-archive">
    <div class="section-heading">
      <div>
        <p class="mini">LISTENING ARCHIVE</p>
        <h2>Other records</h2>
      </div>
      <span class="archive-count" data-music-count></span>
    </div>
    <div class="archive-grid" data-music-archive></div>
  </section>
</main>

<div class="service-modal" data-service-modal aria-hidden="true">
  <div class="service-backdrop" data-service-close></div>
  <section class="service-card" role="dialog" aria-modal="true" aria-labelledby="service-title">
    <button class="service-close" data-service-close aria-label="Close">×</button>
    <p class="mini">OPEN IN</p>
    <h2 id="service-title">Album title</h2>
    <p id="service-artist">Artist name</p>
    <div class="service-actions">
      <a href="#" target="_blank" rel="noreferrer" data-spotify-link>Spotify ↗</a>
      <a href="#" target="_blank" rel="noreferrer" data-apple-link>Apple Music ↗</a>
    </div>
  </section>
</div>

<div data-nav-placeholder></div>
<script src="data/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
